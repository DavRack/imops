[package]
name = "pichromatic"
version = "0.1.0"
edition = "2021"
description = "A Photo editing library for photographers"
license = "MIT"

[profile.release]
lto = "fat"

[lib]
name = "pichromatic"
path = "src/lib.rs"


[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_with = "*"
rayon = "1.10.0"
wgpu = "23.0.0"
bytemuck = { version = "1.16.0", features = ["derive"] }
pollster = "0.3.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
getrandom = { version = "0.2.17", features = ["js"] }
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "OffscreenCanvas"] }

