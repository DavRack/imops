#### Pixel Pipeline — physically-based film (PositiveLinear) ####
# Usage: ./run <raw.dng> imgconfig-film.toml
#
# PositiveLinear is a diagnostic negative invert; the following display transform
# provides bounded tone and gamut mapping, not a measured film-print profile.

[[pipeline_modules]]
name = "Demosaic"
algorithm = "markesteijn"

[[pipeline_modules]]
name = "Vignette"
strength = 1.0

[[pipeline_modules]]
name = "CFACoeffs"

[[pipeline_modules]]
name = "LumaGuidedChromaDenoise"
radius = 2
epsilon = 0.01

[[pipeline_modules]]
name = "HighlightReconstruction"

[[pipeline_modules]]
name = "BaselineExposureCompensation"

[[pipeline_modules]]
name = "Exp"
ev = 0.0

# [[pipeline_modules]]
# name = "Contrast"
# c = 0.5

[[pipeline_modules]]
name = "CST"
target_color_space = "AcesCg"

[[pipeline_modules]]
name = "Film"
stock = "Ektar100"
film_format = "Film35mm"
seed = 1
output = "PositiveLinear"

# [[pipeline_modules]]
# name = "Film"
# stock = "Ektar100"
# film_format = "Film35mm"
# seed = 1
# output = "PositiveLinear"

[[pipeline_modules]]
name = "Exp"
ev = 0.0

# [[pipeline_modules]]
# name = "Exp"
# ev = 0

# [[pipeline_modules]]
# name = "Contrast"
# c = 1

[[pipeline_modules]]
name = "SigmoidToneMap"

# EXR is linear display-referred sRGB. JPEG output is sRGB-OETF encoded by the writer.
[[pipeline_modules]]
name = "CST"
target_color_space = "LinearSrgb"

[[pipeline_modules]]
name = "Rotation"
angle = "auto"
