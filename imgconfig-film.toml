#### Pixel Pipeline — physically-based film (PositiveLinear) ####
# Usage: ./run <raw.dng> imgconfig-film.toml
#
# PositiveLinear is the analytic mid/Dmin inversion used for display output.
# NegativeLinear is the densitometric scan of the developed negative and is
# appropriate for inspecting film grain/cloud structure.

[[pipeline_modules]]
name = "Demosaic"
algorithm = "markesteijn"

[[pipeline_modules]]
name = "Vignette"
strength = 1.0

[[pipeline_modules]]
name = "HighlightReconstruction"

[[pipeline_modules]]
name = "CFACoeffs"

[[pipeline_modules]]
name = "LumaGuidedChromaDenoise"
radius = 2
epsilon = 0.01

[[pipeline_modules]]
name = "BaselineExposureCompensation"

[[pipeline_modules]]
name = "Exp"
ev = 0.0

# [[pipeline_modules]]
# name = "Contrast"
# c = 0.5

[[pipeline_modules]]
name = "CST"
target_color_space = "AcesCg"

[[pipeline_modules]]
name = "Film"
stock = "Portra400"
film_format = "Film35mm"
# Debug/microscope render width: the same stock chemistry sampled across 0.5 mm.
render_width_mm = 1.0
seed = 1
enable_halation = false
output = "PositiveLinear"
# compensate_box_speed = true  (default): exposure is scene-relative, stock
#   box ISO does not shift brightness — swapping stocks only changes character.
#   Set false for the raw box-speed step (faster stock = brighter at same input).

# [[pipeline_modules]]
# name = "Film"
# stock = "Portra400"
# film_format = "Film35mm"
# seed = 1
# output = "PositiveLinear"


# [[pipeline_modules]]
# name = "Exp"
# ev = 0

# [[pipeline_modules]]
# name = "Contrast"
# c = 1

[[pipeline_modules]]
name = "SigmoidToneMap"

# EXR is linear display-referred sRGB. JPEG output is sRGB-OETF encoded by the writer.
[[pipeline_modules]]
name = "CST"
target_color_space = "Srgb"

[[pipeline_modules]]
name = "Rotation"
angle = "auto"
