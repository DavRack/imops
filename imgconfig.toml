#### Pixel Pipeline ####

[[pipeline_modules]]
name = "Demosaic"
algorithm = "markesteijn"

[[pipeline_modules]]
name = "Vignette"
strength = 1.0

[[pipeline_modules]]
name = "CFACoeffs"

[[pipeline_modules]]
name = "HighlightReconstruction"

[[pipeline_modules]]
name = "Exp"
ev = 0.0

[[pipeline_modules]]
name = "LumaGuidedChromaDenoise"
radius = 2
epsilon = 0.01

[[pipeline_modules]]
name = "BaselineExposureCompensation"
[[pipeline_modules]]
name = "CST"
target_color_space = "AcesCg"


[[pipeline_modules]]
name = "InverseHdToneMap"
strength = 1.5

# EXR is linear display-referred sRGB. JPEG output is sRGB-OETF encoded by the writer.
[[pipeline_modules]]
name = "CST"
target_color_space = "Srgb"

[[pipeline_modules]]
name = "Rotation"
angle = "auto"
